workflows:
  # For testers: Google's test ads. Never submit one of these builds to App Store review.
  ios-testflight: &ios_workflow
    name: FaceUp Pairs iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: faceup_asc_api_key
    environment:
      # Same rule as FaceUp Blackjack: no `ios_signing` block, the explicit fetch script below
      # creates the certificate and profile on the first build.
      groups:
        - ios_signing
        - pairs_env
      vars:
        BUNDLE_ID: "com.beaudoin.faceuppairs"
        XCODE_WORKSPACE: "ios/FaceUpPairs.xcworkspace"
        XCODE_SCHEME: "FaceUpPairs"
        # TestFlight builds show Google's test ads, not the real ones (see src/lib/ads.ts).
        EXPO_PUBLIC_ADS_TEST: "true"
      node: 22
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.cocoapods
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Generate the native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          for attempt in 1 2 3; do
            pod install && break
            if [ "$attempt" = 3 ]; then
              echo "pod install failed 3 times, giving up."
              exit 1
            fi
            echo "pod install failed (attempt $attempt/3), retrying in 30s..."
            sleep 30
          done
      - name: Initialize keychain
        script: keychain initialize
      - name: Prepare certificate signing key
        script: |
          if [ -z "$IOS_CERTIFICATE_PRIVATE_KEY_B64" ]; then
            echo "IOS_CERTIFICATE_PRIVATE_KEY_B64 is not set (group ios_signing)."
            exit 1
          fi
          echo "$IOS_CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -A -d > /tmp/certificate_private_key.pem
          openssl rsa -in /tmp/certificate_private_key.pem -check -noout
      - name: Fetch or create signing certificate and provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/certificate_private_key.pem \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Bump build number
        script: |
          if [ -z "$BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER is empty."
            exit 1
          fi
          # Codemagic's counter restarts when the app is re-added, so go one past the highest
          # build App Store Connect already has (it rejects a reused number).
          NEXT_BUILD_NUMBER="$BUILD_NUMBER"
          APP_ID=$(app-store-connect apps list --bundle-id-identifier "$BUNDLE_ID" --strict-match-identifier --json \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)[0]["id"])') || APP_ID=""
          if [ -n "$APP_ID" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_ID") || LATEST=0
            if [ "$LATEST" -ge "$NEXT_BUILD_NUMBER" ] 2>/dev/null; then
              NEXT_BUILD_NUMBER=$((LATEST + 1))
            fi
          fi
          echo "App Store Connect app: ${APP_ID:-not found}, latest TestFlight build: ${LATEST:-unknown}"
          echo "Build number: $NEXT_BUILD_NUMBER"
          PBXPROJ="$CM_BUILD_DIR/ios/FaceUpPairs.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $NEXT_BUILD_NUMBER;/g" "$PBXPROJ"
          # Expo prebuild writes CFBundleVersion as a literal in Info.plist, so the pbxproj value
          # alone never reaches the archive.
          INFO_PLIST="$CM_BUILD_DIR/ios/FaceUpPairs/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD_NUMBER" "$INFO_PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$INFO_PLIST"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true

  # The build to pick for the App Store version: same recipe, real ads (no EXPO_PUBLIC_ADS_TEST).
  # It also lands in TestFlight; installed from there, its ads are real, so don't tap them.
  ios-release:
    <<: *ios_workflow
    name: FaceUp Pairs iOS - App Store
    environment:
      groups:
        - ios_signing
        - pairs_env
      vars:
        BUNDLE_ID: "com.beaudoin.faceuppairs"
        XCODE_WORKSPACE: "ios/FaceUpPairs.xcworkspace"
        XCODE_SCHEME: "FaceUpPairs"
      node: 22
      xcode: latest
      cocoapods: default

  # Android, same recipe as FaceUp Blackjack's android-play adapted to Expo (android/ is generated
  # by prebuild, never committed). Real ads, like ios-release.
  android-play:
    name: FaceUp Pairs Android - Play Store (AAB)
    max_build_duration: 45
    # linux_x2 is not on this account's billing plan, so the same Mac as iOS.
    instance_type: mac_mini_m2
    environment:
      groups:
        # Same EXPO_PUBLIC_* values as iOS; EXPO_PUBLIC_REVENUECAT_ANDROID_KEY lives here too.
        - pairs_env
        # ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD,
        # all secure. The keystore is credentials/faceuppairs-upload.jks (PKCS12: one password).
        - android_signing
      vars:
        PACKAGE_NAME: "com.beaudoin.faceuppairs"
      node: 22
      java: 17
    cache:
      cache_paths:
        - $HOME/.gradle/caches
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Generate the native Android project
        script: npx expo prebuild --platform android --no-install
      - name: Write the upload keystore
        # Play binds the listing to the key of its first upload: refuse to build rather than ship
        # an AAB signed with the debug key that expo prebuild configures for release.
        script: |
          if [ -z "$ANDROID_KEYSTORE_B64" ]; then
            echo "ANDROID_KEYSTORE_B64 is not set (group android_signing)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_B64" | openssl base64 -A -d > "$CM_BUILD_DIR/android/upload.jks"
      - name: Set versionCode from the build counter
        # Play rejects a versionCode it has already seen; prebuild writes `versionCode 1`.
        script: |
          set -e
          if [ -z "$BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER is empty."
            exit 1
          fi
          GRADLE="$CM_BUILD_DIR/android/app/build.gradle"
          # BSD sed on macOS: -i '' (the Linux spelling silently does nothing, see Blackjack).
          sed -i '' "s/versionCode [0-9]*/versionCode $BUILD_NUMBER/" "$GRADLE"
          if ! grep -q "versionCode $BUILD_NUMBER" "$GRADLE"; then
            echo "versionCode was not rewritten to $BUILD_NUMBER:"
            grep -n "versionCode" "$GRADLE"
            exit 1
          fi
          grep -n "versionCode\|versionName" "$GRADLE"
      - name: Build signed AAB
        # The injected signing properties override the debug signingConfig of the generated
        # build.gradle, so nothing in it needs patching.
        script: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file="$CM_BUILD_DIR/android/upload.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - name: Verify the AAB is signed with the upload key
        script: |
          set -e
          AAB=$(find "$CM_BUILD_DIR/android/app/build/outputs/bundle/release" -name "*.aab" | head -1)
          if [ -z "$AAB" ]; then
            echo "No .aab was produced."
            exit 1
          fi
          CERT=$(unzip -p "$AAB" 'META-INF/*.RSA' | keytool -printcert)
          echo "$CERT"
          if echo "$CERT" | grep -qi "CN=Android Debug"; then
            echo "This AAB is signed with the Android debug key, refusing to publish it."
            exit 1
          fi
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
      - android/app/build/outputs/**/mapping.txt
    # No `publishing: google_play`: Google's API can't create the first release of an app, that
    # upload is done by hand in the Play Console.
