workflows:
  ios-testflight:
    name: FaceUp Pairs iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: faceup_asc_api_key
    environment:
      # Same rule as FaceUp Blackjack: no `ios_signing` block, the explicit fetch script below
      # creates the certificate and profile on the first build.
      groups:
        - ios_signing
        - pairs_env
      vars:
        BUNDLE_ID: "com.beaudoin.faceuppairs"
        XCODE_WORKSPACE: "ios/FaceUpPairs.xcworkspace"
        XCODE_SCHEME: "FaceUpPairs"
        # TestFlight builds show Google's test ads, not the real ones (see src/lib/ads.ts).
        EXPO_PUBLIC_ADS_TEST: "true"
      node: 22
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.cocoapods
        - $HOME/Library/Caches/CocoaPods
    scripts:
      - name: Install npm dependencies
        script: npm ci
      - name: Generate the native iOS project
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          for attempt in 1 2 3; do
            pod install && break
            if [ "$attempt" = 3 ]; then
              echo "pod install failed 3 times, giving up."
              exit 1
            fi
            echo "pod install failed (attempt $attempt/3), retrying in 30s..."
            sleep 30
          done
      - name: Initialize keychain
        script: keychain initialize
      - name: Prepare certificate signing key
        script: |
          if [ -z "$IOS_CERTIFICATE_PRIVATE_KEY_B64" ]; then
            echo "IOS_CERTIFICATE_PRIVATE_KEY_B64 is not set (group ios_signing)."
            exit 1
          fi
          echo "$IOS_CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -A -d > /tmp/certificate_private_key.pem
          openssl rsa -in /tmp/certificate_private_key.pem -check -noout
      - name: Fetch or create signing certificate and provisioning profile
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/certificate_private_key.pem \
            --create
      - name: Add certificates to keychain
        script: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles
      - name: Bump build number
        script: |
          if [ -z "$BUILD_NUMBER" ]; then
            echo "BUILD_NUMBER is empty."
            exit 1
          fi
          PBXPROJ="$CM_BUILD_DIR/ios/FaceUpPairs.xcodeproj/project.pbxproj"
          sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*;/CURRENT_PROJECT_VERSION = $BUILD_NUMBER;/g" "$PBXPROJ"
          grep "CURRENT_PROJECT_VERSION" "$PBXPROJ"
      - name: Build ipa for distribution
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
