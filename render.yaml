# Render Blueprint for FaceUp Pairs
# Automates deployment configuration on Render
# See: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: faceuppairs-server
    env: node
    region: frankfurt  # EU region (closest for France)
    plan: free         # Upgrade to 'starter' for 24/7 uptime
    buildCommand: "cd server && npm ci && npm run build"
    startCommand: "cd server && npm run start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: faceuppairs-db
          property: connectionString

databases:
  - name: faceuppairs-db
    plan: free         # Upgrade to 'starter' for HA
    region: frankfurt
    ttlMonths: 0       # No auto-deletion (free tier has daily backups)
